spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assetguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
assetguard.auth.session-hours=${SESSION_TTL_HOURS:8}
assetguard.auth.cookie-secure=${SESSION_COOKIE_SECURE:false}
assetguard.auth.allowed-origin=${APP_ORIGIN:http://localhost:3000}
